name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component or area
      description: For example Button, DSProvider, tokens, build.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A Storybook link or a minimal code sample is ideal.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: 'loui-ds version, React version, browser, OS, assistive technology if relevant.'
  - type: checkboxes
    id: a11y
    attributes:
      label: Accessibility
      options:
        - label: This is an accessibility problem (keyboard, screen reader, contrast, motion)
