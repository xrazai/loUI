# CI gate: everything in `pnpm check` except visual regression (the `check` job). Visual regression
# is Windows-first for now: run `pnpm test:visual` locally on Windows before pushing. The Linux
# `visual` job only runs when started by hand (Actions > CI > Run workflow); cross-platform
# baselines are paused (see tests/visual/README.md).
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:ci
      - run: pnpm publint
      - run: pnpm size
      - run: pnpm attw
      - run: pnpm build-storybook
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-failures
          path: .vitest/attachments
          if-no-files-found: ignore
  # Packaging check (REL-001): packs the library and builds the Vite and Next.js (App Router)
  # examples against the tarball in isolation. Needs the `check` job so a broken build fails there first.
  examples:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm examples:verify
  # Visual regression in the same pinned container that generated the Linux baselines
  # (.github/workflows/visual-baselines.yml). Skipped while no `*-chromium-linux.png` exists.
  visual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Check for linux baselines
        id: baselines
        run: |
          count=$(find tests/visual/__screenshots__ -name '*-chromium-linux.png' | wc -l)
          echo "Found $count linux baselines"
          if [ "$count" -gt 0 ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        if: steps.baselines.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.baselines.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.baselines.outputs.present == 'true'
      - run: pnpm test:visual
        if: steps.baselines.outputs.present == 'true'
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            .vitest/attachments
            tests/visual/__screenshots__/**/*-actual.png
            tests/visual/__screenshots__/**/*-diff.png
          if-no-files-found: ignore
