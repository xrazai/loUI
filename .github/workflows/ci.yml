# CI gate: everything in `pnpm check:ci`, split into parallel jobs (static, 4 test shards, package). Visual regression
# is Windows-first for now: run `pnpm test:visual` locally on Windows before pushing. The Linux
# `visual` job only runs when started by hand (Actions > CI > Run workflow); cross-platform
# baselines are paused (see tests/visual/README.md).
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Fast feedback: tokens, lint, types, node unit tests, tools (ESLint plugin, MCP server, AI eval).
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm vitest run --project unit
      - run: pnpm test:tools
  # Browser and Storybook tests, split into shards that run in parallel.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm vitest run --project browser --project storybook --shard=${{ matrix.shard }}/4
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-failures-${{ matrix.shard }}
          path: .vitest/attachments
          if-no-files-found: ignore
  # Library build and everything that inspects it, plus the consumer examples (REL-001).
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm manifest:check
      - run: pnpm api:check
      - run: pnpm test:treeshake
      - run: pnpm publint
      - run: pnpm size
      - run: pnpm attw
      - run: pnpm examples:verify
      - run: pnpm build-storybook
  # Visual regression in the same pinned container that generated the Linux baselines
  # (.github/workflows/visual-baselines.yml). Skipped while no `*-chromium-linux.png` exists.
  visual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - name: Check for linux baselines
        id: baselines
        run: |
          count=$(find tests/visual/__screenshots__ -name '*-chromium-linux.png' | wc -l)
          echo "Found $count linux baselines"
          if [ "$count" -gt 0 ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v5
        if: steps.baselines.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.baselines.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.baselines.outputs.present == 'true'
      - run: pnpm test:visual
        if: steps.baselines.outputs.present == 'true'
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            .vitest/attachments
            tests/visual/__screenshots__/**/*-actual.png
            tests/visual/__screenshots__/**/*-diff.png
          if-no-files-found: ignore
