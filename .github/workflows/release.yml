# Release (docs/release/README.md): pushing a tag `v<version>` builds the library, verifies the
# package, creates a GitHub Release with the tarball attached and publishes `loui-ds` to npm with
# provenance (ADR-0004: MIT, public). npm authenticates the workflow with Trusted Publishing
# (OIDC, configured on npmjs.com for xrazai/loUI + release.yml): no npm token is stored anywhere.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write # npm Trusted Publishing (OIDC) and provenance
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm publint
      - run: pnpm attw
      - run: pnpm size
      - name: Pack
        run: |
          mkdir -p .release
          pnpm pack --pack-destination .release
          ls -l .release
      - name: Release notes for this version
        run: |
          awk -v v="## $VERSION" '$0==v {on=1; next} /^## / && on {exit} on' docs/release/CHANGELOG.md > .release/notes.md
          {
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "pnpm add loui-ds@${VERSION} react react-dom"
            echo '```'
          } >> .release/notes.md
          cat .release/notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" .release/*.tgz \
            --title "Loui DS $GITHUB_REF_NAME" \
            --notes-file .release/notes.md \
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
      - name: Publish to npm
        # Trusted Publishing needs npm 11.5.1 or later (Node 24 ships it).
        run: |
          npm --version
          npm publish .release/loui-ds-${VERSION}.tgz --access public --provenance ${{ contains(github.ref_name, '-') && '--tag next' || '' }}
