# Release (docs/release/README.md): pushing a tag `v<version>` builds the library, verifies the
# package, publishes `loui-ds` to npm with provenance (ADR-0004: MIT, public) and creates a GitHub
# Release with the tarball attached. npm authenticates the workflow with Trusted Publishing (OIDC,
# configured on npmjs.com for xrazai/loUI + release.yml): no npm token is stored anywhere.
# To retry a failed release, run this workflow by hand with the tag; steps already done are skipped.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release again, for example v0.2.1
        required: true
permissions:
  contents: write
  id-token: write # npm Trusted Publishing (OIDC) and provenance
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      # No registry-url: it writes a placeholder token that hides Trusted Publishing errors.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm publint
      - run: pnpm attw
      - run: pnpm size
      - name: Pack
        run: |
          mkdir -p .release
          pnpm pack --pack-destination .release
          ls -l .release
      - name: Release notes for this version
        run: |
          awk -v v="## $VERSION" '$0==v {on=1; next} /^## / && on {exit} on' docs/release/CHANGELOG.md > .release/notes.md
          {
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "pnpm add loui-ds@${VERSION} react react-dom"
            echo '```'
          } >> .release/notes.md
          cat .release/notes.md
      - name: Publish to npm
        # Trusted Publishing needs npm 11.5.1 or later (Node 24 ships it).
        run: |
          npm --version
          if npm view "loui-ds@${VERSION}" version > /dev/null 2>&1; then
            echo "loui-ds@${VERSION} is already on npm; skipping."
            exit 0
          fi
          npm publish .release/loui-ds-${VERSION}.tgz --access public --provenance ${{ contains(env.TAG, '-') && '--tag next' || '' }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; skipping."
            exit 0
          fi
          gh release create "$TAG" .release/*.tgz \
            --title "Loui DS $TAG" \
            --notes-file .release/notes.md \
            ${{ contains(env.TAG, '-') && '--prerelease' || '' }}
