<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head><body style="padding:24px;box-sizing:border-box"><div id="root"></div>
<script type="text/babel">
const DS = (() => { for (const k of Object.keys(window)) { try { const v = window[k]; if (v && typeof v === "object" && v.Button && v.Badge && v.Dialog) return v; } catch (e) {} } return {}; })();
const Row = ({ children, gap = 10 }) => <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", gap }}>{children}</div>;
const Cap = ({ children }) => <div style={{ font: "500 11px var(--font-mono)", letterSpacing: ".08em", textTransform: "uppercase", color: "var(--text-3)", marginBottom: 10 }}>{children}</div>;

const { Combobox, DatePicker, FileUpload, Slider, CurrencyInput, SearchInput } = DS;
const CLIENTES = ["Atelier Nove", "Brightwater", "Corvid Labs", "Fjord Studio", "Halden & Co.", "Kessler GmbH", "Lumen Goods", "Mira Têxtil", "Oakline Supply", "Pine & Pixel"].map((c, i) => ({ value: c, label: c, meta: (i * 7 % 23 + 2) + " pedidos" }));
const PRODUTOS = [{ label: "Linho natural", meta: "SKU-204" }, { label: "Linho misto", meta: "SKU-219" }, { label: "Algodão cru", meta: "SKU-101" }, { label: "Algodão egípcio", meta: "SKU-117" }, { label: "Viscose estampada", meta: "SKU-330" }];
function Demo() {
  const [c, sc] = React.useState("Mira Têxtil"), [d, sd] = React.useState("2026-11-04"), [q, sq] = React.useState("lin"), [p, sp] = React.useState(1240), [s, ss] = React.useState(15);
  return <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
      <Combobox label="Cliente" value={c} onChange={sc} options={CLIENTES} />
      <DatePicker label="Entrega" value={d} onChange={sd} />
      <CurrencyInput label="Preço por metro" value={p} onChange={sp} />
    </div>
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, alignItems: "start" }}>
      <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
        <SearchInput label="Buscar produto" value={q} onChange={sq} suggestions={PRODUTOS} />
        <Slider label="Desconto" value={s} onChange={ss} max={50} format={(v) => v + "%"} />
      </div>
      <FileUpload label="Anexos" />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
