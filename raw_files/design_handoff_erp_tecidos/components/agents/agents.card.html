<!-- @dsCard group="Components" viewport="760x980" name="Agentes" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head><body style="padding:24px;box-sizing:border-box"><div id="root"></div>
<script type="text/babel">
const DS = (() => { for (const k of Object.keys(window)) { try { const v = window[k]; if (v && typeof v === "object" && v.Button && v.Badge && v.Dialog) return v; } catch (e) {} } return {}; })();
const Cap = ({ children }) => <div style={{ font: "500 11px var(--font-mono)", letterSpacing: ".08em", textTransform: "uppercase", color: "var(--text-3)", marginBottom: 10 }}>{children}</div>;
const { AgentCard, ApprovalCard, ChatPanel, Textarea, Rating, SuggestionChip } = DS;
function Demo() {
  const [d, sd] = React.useState("Sentimos muito pelo defeito, isso não é o nosso padrão. Chame a gente no chat da Shopee com uma foto que resolvemos com troca ou reembolso.");
  const [msgs, sm] = React.useState([{ role: "user", content: "Que cores de linho eu tenho hoje?" }, { role: "assistant", content: "Linho natural em branco, off-white, terracota, verde oliva e azul serenity, a partir de R$ 89,90." }]);
  const [busy, sb] = React.useState(false), [txt, st] = React.useState("Tom: simpático, direto e curto.");
  const ask = (t) => { sm((m) => [...m, { role: "user", content: t }]); sb(true); setTimeout(() => { sm((m) => [...m, { role: "assistant", content: "Resposta de exemplo." }]); sb(false); }, 900); };
  return <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
    <div><Cap>AgentCard</Cap><div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
      <AgentCard name="Agente Shopee" area="Marketplace" icon="shopping-bag" pending={4} description="Responde perguntas de compradores e avaliações da loja. Você aprova antes de enviar." last="Última resposta às 08:40" onOpen={() => {}} />
      <AgentCard name="Agente WhatsApp" area="Atendimento" icon="message-circle" status="soon" description="Vai montar rascunho de pedido pela conversa e enviar o PDF." />
    </div></div>
    <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) 320px", gap: 16, alignItems: "stretch" }}>
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <div><Cap>ApprovalCard · Rating</Cap><ApprovalCard kind="review" rating={2} author="compradora_sp" product="Malha · Preto" swatch="#1B1B1D" when="hoje · 10:40" message="A malha veio com um pequeno defeito na ponta. Não gostei." draft={d} onDraftChange={sd} flag="Avaliação de 2 estrelas: revise com calma antes de enviar." /></div>
        <div><Cap>Textarea · SuggestionChip</Cap><Textarea label="Diretrizes" aside="Salvo automaticamente" rows={3} value={txt} onChange={(e) => st(e.target.value)} />
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}><SuggestionChip onClick={() => st(txt + "\nNão use emoji.")}>Sem emoji</SuggestionChip><SuggestionChip>Assinar como Minha loja</SuggestionChip></div></div>
      </div>
      <div><Cap>ChatPanel</Cap><div style={{ height: 520, border: "1px solid var(--line)", borderRadius: "var(--radius-lg)", overflow: "hidden" }}><ChatPanel messages={msgs} busy={busy} onSend={ask} onClear={() => sm([])} prompts={["Como você responderia: “tem tricoline mostarda?”"]} intro="Teste respostas ou peça ajustes." /></div></div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script></body></html>
