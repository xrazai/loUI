<!-- @dsCard group="Colors" viewport="700x170" subtitle="Três níveis de texto + inverso" name="Text" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box}.m{font:400 10.5px/1.3 var(--font-mono);color:var(--text-3)}.n{font:500 12px/1.3 var(--font-sans);color:var(--text)}</style>
</head><body><div style="display:flex;flex-direction:column;gap:10px">
 <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--text);font-size:14px">Texto principal — títulos, valores, conteúdo</span><span class="m">--text · 16.6:1</span></div>
 <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--text-2);font-size:14px">Texto secundário — descrições, rótulos de navegação</span><span class="m">--text-2 · 8.2:1</span></div>
 <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--text-3);font-size:14px">Texto discreto — metadados, placeholders, atalhos</span><span class="m">--text-3 · 4.7:1</span></div>
 <div style="display:flex;justify-content:space-between;align-items:center"><span style="color:var(--text-inverse);background:var(--primary-bg);font-size:13px;font-weight:500;padding:4px 10px;border-radius:var(--radius-sm)">Texto inverso — em botões primários e tooltips</span><span class="m">--text-inverse</span></div></div></body></html>
