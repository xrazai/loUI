<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box}.m{font:400 10.5px/1.3 var(--font-mono);color:var(--text-3)}.n{font:500 12px/1.3 var(--font-sans);color:var(--text)}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:48px;border-radius:var(--radius);border:1px solid var(--line-subtle);background:var(--surface)"></div><div class="n">Sutil</div><div class="m">--line-subtle · divisores internos</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:48px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface)"></div><div class="n">Padrão</div><div class="m">--line · cards, inputs em superfície</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:48px;border-radius:var(--radius);border:1px solid var(--line-strong);background:var(--surface)"></div><div class="n">Forte</div><div class="m">--line-strong · controles, overlays</div></div></div></body></html>
