<!-- @dsCard group="Colors" viewport="700x150" subtitle="Fundos semânticos, do canvas ao hover" name="Surfaces" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box}.m{font:400 10.5px/1.3 var(--font-mono);color:var(--text-3)}.n{font:500 12px/1.3 var(--font-sans);color:var(--text)}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:var(--radius);background:var(--bg-canvas);border:1px solid var(--line);"></div><div class="n">canvas</div><div class="m">--bg-canvas</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:var(--radius);background:var(--bg);border:1px solid var(--line);"></div><div class="n">bg</div><div class="m">--bg</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);"></div><div class="n">surface</div><div class="m">--surface</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:var(--radius);background:var(--surface-raised);border:1px solid var(--line);"></div><div class="n">raised</div><div class="m">--surface-raised</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:var(--radius);background:var(--surface-hover);border:1px solid var(--line);"></div><div class="n">hover</div><div class="m">--surface-hover</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:var(--radius);background:var(--surface-row-hover);border:1px solid var(--line);"></div><div class="n">row-hover</div><div class="m">--surface-row-hover</div></div></div></body></html>
