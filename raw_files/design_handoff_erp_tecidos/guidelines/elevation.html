<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Bordas primeiro; sombra só em overlays" name="Elevation" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box}.m{font:400 10.5px/1.3 var(--font-mono);color:var(--text-3)}.n{font:500 12px/1.3 var(--font-sans);color:var(--text)}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:8px">
 <div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg)"></div><div class="n">Plano</div><div class="m">surface + line</div></div>
 <div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;background:var(--surface-raised);border:1px solid var(--line-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-overlay)"></div><div class="n">Overlay</div><div class="m">menus, toasts · --shadow-overlay</div></div>
 <div style="display:flex;flex-direction:column;gap:8px"><div style="height:72px;background:var(--surface-raised);border:1px solid var(--line-strong);border-radius:var(--radius-lg);box-shadow:var(--shadow-dialog)"></div><div class="n">Diálogo</div><div class="m">modais · --shadow-dialog</div></div></div></body></html>
