<!-- @dsCard group="Colors" viewport="700x150" subtitle="Acento + estados, cor cheia e versão suave" name="Signal" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box}.m{font:400 10.5px/1.3 var(--font-mono);color:var(--text-3)}.n{font:500 12px/1.3 var(--font-sans);color:var(--text)}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px"><div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;height:44px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)"><div style="flex:1;background:var(--accent)"></div><div style="flex:1;background:var(--accent-soft)"></div></div><div class="n">Accent</div><div class="m">--accent · foco, seleção, link</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;height:44px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)"><div style="flex:1;background:var(--success)"></div><div style="flex:1;background:var(--success-soft)"></div></div><div class="n">Success</div><div class="m">--success · concluído</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;height:44px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)"><div style="flex:1;background:var(--warning)"></div><div style="flex:1;background:var(--warning-soft)"></div></div><div class="n">Warning</div><div class="m">--warning · pendente</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;height:44px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)"><div style="flex:1;background:var(--danger)"></div><div style="flex:1;background:var(--danger-soft)"></div></div><div class="n">Danger</div><div class="m">--danger · erro, destrutivo</div></div></div></body></html>
